<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin — Lecturer approvals</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <h1>Lecturer approvals</h1>
    <button class="secondary" style="width:auto" onclick="logout()">Log out</button>
  </div>
  <p class="sub" id="who"></p>

  <div class="card">
    <div id="lecturers-list"></div>
  </div>

  <div class="card">
    <h2>Auto-approve staff numbers</h2>
    <p class="sub">Lecturers signing up with a staff number on this list skip the pending queue automatically.</p>
    <form id="auto-approve-form" onsubmit="return addAutoApprove(event)">
      <input type="text" id="new-staff-number" placeholder="Staff number" required>
      <button type="submit" style="width:auto">Add</button>
    </form>
    <div id="auto-approve-list"></div>
  </div>
</div>
<script src="/js/admin.js"></script>
</body>
</html>
