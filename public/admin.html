<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AMIU SmartNotes — Admin</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">
  <div class="brand-bar">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 3.5C5 2.67 5.67 2 6.5 2H14L19 7V20.5C19 21.33 18.33 22 17.5 22H6.5C5.67 22 5 21.33 5 20.5V3.5Z" fill="white" fill-opacity="0.18" stroke="white" stroke-width="1.4"/>
        <path d="M14 2V6.5C14 6.78 14.22 7 14.5 7H19" stroke="white" stroke-width="1.4"/>
        <path d="M7 13.5H9.2L10.4 10.5L12.6 16.5L13.8 13.5H17" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="brand-name">AMIU <span>SmartNotes</span></div>
  </div>

  <div class="top-bar">
    <h1>Lecturer approvals</h1>
    <button class="secondary" style="width:auto" onclick="logout()">Log out</button>
  </div>
  <p class="sub" id="who"></p>
  <p class="sub" id="pending-count" style="font-weight:700; color:var(--marigold-deep)"></p>

  <div class="card" data-accent="marigold">
    <h3>Auto-approved emails</h3>
    <p class="note-meta">A lecturer signing up with one of these emails is approved instantly — no review needed. This list grows automatically every time you approve someone below, or you can add one directly here ahead of time.</p>
    <label>Email address</label>
    <input id="new-auto-email" placeholder="e.g. samuel.mwangi@amref.org">
    <button onclick="addAutoApprove()">Add</button>
    <div class="error" id="auto-approve-error"></div>
    <div id="auto-approve-list" style="margin-top:12px"></div>
  </div>

  <div class="card" data-accent="teal">
    <h3>Lecturer signups</h3>
    <div id="lecturers-list"></div>
  </div>
</div>

<script src="/js/admin.js"></script>
</body>
</html>
