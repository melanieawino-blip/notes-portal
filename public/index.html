<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AMREF ITC Notes Portal — Log in</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">
  <h1>AMREF ITC notes portal</h1>
  <p class="sub">Lecturers upload course notes. Students download them.</p>

  <div class="card">
    <h3>Log in</h3>
    <label>Email</label>
    <input id="login-email" type="email">
    <label>Password</label>
    <input id="login-password" type="password">
    <button onclick="login()">Log in</button>
    <div class="error" id="login-error"></div>
  </div>

  <div class="card">
    <h3>Create an account</h3>
    <label>Full name</label>
    <input id="signup-name" type="text">
    <label>Email</label>
    <input id="signup-email" type="email">
    <label>Password</label>
    <input id="signup-password" type="password">
    <label>I am a...</label>
    <select id="signup-role" onchange="onRoleChange()">
      <option value="student">Student</option>
      <option value="lecturer">Lecturer</option>
    </select>
    <label id="id-number-label">Student number (e.g. DCP-1234)</label>
    <input id="signup-id-number" type="text">
    <button onclick="signup()">Create account</button>
    <div class="error" id="signup-error"></div>
  </div>
</div>

<script src="/js/login.js"></script>
</body>
</html>
