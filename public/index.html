<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AMIU SmartNotes — Log in</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">
  <div class="brand-bar">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 3.5C5 2.67 5.67 2 6.5 2H14L19 7V20.5C19 21.33 18.33 22 17.5 22H6.5C5.67 22 5 21.33 5 20.5V3.5Z" fill="white" fill-opacity="0.18" stroke="white" stroke-width="1.4"/>
        <path d="M14 2V6.5C14 6.78 14.22 7 14.5 7H19" stroke="white" stroke-width="1.4"/>
        <path d="M7 13.5H9.2L10.4 10.5L12.6 16.5L13.8 13.5H17" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="brand-name">AMIU <span>SmartNotes</span></div>
  </div>

  <h1>Welcome back</h1>
  <p class="sub">Lecturers upload course notes. Students find and download them — all in one place.</p>

  <div class="card" data-accent="teal">
    <h3>Log in</h3>
    <label>Email</label>
    <input id="login-email" type="email">
    <label>Password</label>
    <input id="login-password" type="password">
    <button onclick="login()">Log in</button>
    <div class="error" id="login-error"></div>
  </div>

  <div class="card" data-accent="marigold">
    <h3>Create an account</h3>
    <label>Full name</label>
    <input id="signup-name" type="text">
    <label>Email</label>
    <input id="signup-email" type="email">
    <label>Password</label>
    <input id="signup-password" type="password">
    <label>I am a...</label>
    <select id="signup-role" onchange="onRoleChange()">
      <option value="student">Student</option>
      <option value="lecturer">Lecturer</option>
    </select>
    <label id="id-number-label">Student number (e.g. DCP-1234)</label>
    <input id="signup-id-number" type="text">
    <button onclick="signup()">Create account</button>
    <div class="error" id="signup-error"></div>
  </div>
</div>

<script src="/js/login.js"></script>
</body>
</html>
