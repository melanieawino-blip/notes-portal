<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lecturer dashboard</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <h1>Lecturer dashboard</h1>
    <div style="display:flex;gap:8px">
      <a id="admin-link" href="/admin.html" style="display:none"><button class="secondary" style="width:auto">Admin</button></a>
      <button class="secondary" style="width:auto" onclick="logout()">Log out</button>
    </div>
  </div>
  <p class="sub" id="who"></p>
  <div class="card" id="pending-banner" style="display:none; border-color:#c99; background:#fff8f0">
    <strong>Your lecturer account is awaiting admin approval.</strong>
    <p class="note-meta">You can log in, but adding courses and uploading notes will be available once approved.</p>
  </div>

  <div class="card">
    <h3>Add a course</h3>
    <label>Course / unit title</label>
    <input id="course-title" placeholder="e.g. Community Health Nursing">
    <label>Unit code (optional)</label>
    <input id="course-code" placeholder="e.g. CHN 201">
    <button onclick="addCourse()">Add course</button>
    <div class="error" id="course-error"></div>
  </div>

  <div class="card">
    <h3>Upload notes</h3>
    <label>Course</label>
    <select id="upload-course"></select>
    <label>PDF file</label>
    <input id="upload-file" type="file" accept="application/pdf">
    <label>Note title (optional — read automatically from the PDF if left blank)</label>
    <input id="upload-title" placeholder="Leave blank to auto-detect from the PDF">
    <button onclick="uploadNote()">Upload</button>
    <div class="error" id="upload-error"></div>
  </div>

  <div class="card">
    <h3>Your uploaded notes</h3>
    <div id="notes-list"></div>
  </div>
</div>

<script src="/js/lecturer.js"></script>
</body>
</html>
